name: openinfra

services:
  postgres:
    image: postgres:17.6-alpine3.22@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:8.2.1-alpine3.22@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # toxiproxy: opt-in ("chaos" profile, never started by `make dev-up`'s
  # default stack or the "multi-node" profile) proxy fault-injection tool
  # in front of Postgres, added for issue #139's "deeper fault injection"
  # item. tests/e2e/suites/20-chaos-injection.sh's existing Redis-loss/
  # PostgreSQL-recovery scenarios use `docker compose stop`/`start` --
  # a clean shutdown signal Postgres itself gets to react to gracefully.
  # toxiproxy instead severs an already-established TCP connection out
  # from under a live client (a "reset_peer" toxic, real TCP RST) while
  # Postgres itself stays fully up and serving every other connection
  # normally -- a genuinely different, more realistic failure mode
  # (mid-write/mid-transaction on the wire) than any black-box Compose
  # start/stop/pause can produce. Scoped down deliberately from "proxy
  # every default-stack Postgres connection through this" (would add a
  # permanent extra hop + new hard dependency to `make dev-up` for every
  # developer, not just this one chaos scenario) to: a profile-gated,
  # nothing-else-touches-it proxy that only
  # tests/e2e/suites/20-chaos-injection.sh's own disposable extra
  # control-plane worker (lib/common.sh's start_extra_controlplane_worker,
  # given this proxy's host-mapped port as its DATABASE_URL) ever talks
  # through -- see that suite for the full scenario. Preloads its one
  # proxy from local/toxiproxy/config.json (committed, no secrets, mirrors
  # local/blockchain-testnet/'s precedent for a committed static config
  # file under deployments/local/) rather than the HTTP admin API, so the
  # proxy exists the instant the container is healthy -- no separate
  # "wait then configure" step for the suite to race against. No
  # healthcheck: the upstream image is a single static binary with no
  # shell/curl/wget to probe itself with (unlike control-plane's
  # grpc-health-probe or blockchain-node's curl); `docker compose up
  # --wait` falls back to "container is running" without one, same as
  # wait_service_healthy's own documented fallback in lib/common.sh.
  toxiproxy:
    profiles: ["chaos"]
    image: ghcr.io/shopify/toxiproxy:2.9.0@sha256:b44c283298cea49e2defaba1b3028783798346f2a926684e3a345fd8441af3b8
    command:
      - -host=0.0.0.0
      - -config=/etc/toxiproxy/config.json
    volumes:
      - ./local/toxiproxy/config.json:/etc/toxiproxy/config.json:ro
    ports:
      - "127.0.0.1:${TOXIPROXY_ADMIN_PORT:-8474}:8474"
      - "127.0.0.1:${TOXIPROXY_POSTGRES_PORT:-15432}:15432"
    networks:
      - default
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ADR-037 §8: self-hosted kubo (the reference Go IPFS implementation),
  # the canonical-tier storage/gateway for the dashboard's content-
  # addressed static frontend release (ADR-037 §1/§3). Nothing in the
  # default dev stack publishes to it yet -- that is
  # control-plane/cmd/frontendrelease's job, run manually by whoever holds
  # the release-signing key (ADR-037 §2) -- so this service can sit idle,
  # healthy, with an empty blockstore, and nothing else in `make dev-up`
  # depends on it (the direct-serve /dashboard/ path, ADR-037's own
  # "additive, not a replacement" framing, is unaffected either way).
  #
  # API (5001) and gateway (8080 in-container, remapped to 8081 on the
  # host since control-plane's own HTTP listener already claims
  # 127.0.0.1:8080) both bound to 127.0.0.1 only, matching every other
  # service's own host-port convention in this file. The P2P swarm port
  # (4001) is deliberately left unpublished: this node's job in the dev
  # stack is to be pinned-to and served-from directly (the canonical
  # tier), not to peer with the wider public IPFS network -- ADR-037 §8's
  # "external pinning redundancy" open question is exactly the case where
  # that would change, not decided here.
  ipfs:
    image: ipfs/kubo:v0.35.0@sha256:6b59935acc23eed3181a0d4684e51e0d59597f028d593cdfe1cd1ed694d53fa6
    ports:
      - "127.0.0.1:${IPFS_API_PORT:-5001}:5001"
      - "127.0.0.1:${IPFS_GATEWAY_PORT:-8081}:8080"
    volumes:
      - ipfs-data:/data/ipfs
    healthcheck:
      # `ipfs id` round-trips through the daemon's own API -- the same
      # "the binary itself proves the service is live" shape
      # docker-socket-proxy's wget-against-/_ping and control-plane's
      # grpc-health-probe already use, without needing curl/wget inside
      # this image at all.
      test: ["CMD", "ipfs", "id"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  blockchain-node:
    build:
      context: ../blockchain
      dockerfile: Dockerfile
    command:
      - --chain=openinfra-dev
      - --base-path=/var/lib/openinfra/data
      # ADR-009: the dev chain spec (openinfra-dev) has exactly one
      # genesis authority, Alice. --consensus=manual-seal-3000 (pre-
      # ADR-009) is gone: the node's CLI no longer accepts it at all now
      # that it runs real Aura block production + GRANDPA finality
      # instead of manual sealing. --alice sets name=Alice and
      # role=authority, but does NOT put usable Aura/GRANDPA keys in the
      # keystore for this image/polkadot-sdk pinning (confirmed directly:
      # an empty keystore, chain stuck at genesis, no block ever
      # authored). The actual keys come from OPENINFRA_DEV_AUTHORITY_SEED
      # below via docker/authority-entrypoint.sh (this image's
      # ENTRYPOINT) -- that explicit `key insert` step is load-bearing
      # here, not redundant with --alice.
      - --alice
      - --force-authoring
      - --rpc-external
      - --rpc-port=9944
      - --rpc-methods=safe
      - --rpc-cors=all
      - --prometheus-external
    environment:
      OPENINFRA_DEV_SUDO_PUBLIC_KEY_FILE: /run/openinfra-chain/bridge-public.hex
      # Consumed by docker/authority-entrypoint.sh (this image's
      # ENTRYPOINT), not by openinfra-node directly. //Alice is the
      # well-known dev SURI matching openinfra-dev's genesis authority
      # (sp_keyring::Sr25519Keyring::Alice / Ed25519Keyring::Alice --
      # blockchain/node/src/chain_spec.rs). base_path/chain must match
      # the --base-path/--chain args above exactly, or the script inserts
      # keys into a keystore path the running node never reads from.
      OPENINFRA_DEV_AUTHORITY_SEED: "//Alice"
      OPENINFRA_NODE_BASE_PATH: /var/lib/openinfra/data
      OPENINFRA_NODE_CHAIN: openinfra-dev
    ports:
      - "127.0.0.1:9944:9944"
      - "127.0.0.1:30333:30333"
    volumes:
      - substrate-data:/var/lib/openinfra
      - ./local/chain:/run/openinfra-chain:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          -H 'content-type: application/json'
          --data '{"jsonrpc":"2.0","id":1,"method":"system_health","params":[]}'
          http://127.0.0.1:9944/ | grep -q '"result"'
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  control-plane:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      SUBSTRATE_RPC_URL: http://blockchain-node:9944
      SUBSTRATE_SIGNER_KEY_FILE: /run/openinfra-tls/bridge-key.pem
      CONTROL_PLANE_GRPC_ADDR: 0.0.0.0:50051
      CONTROL_PLANE_HTTP_ADDR: 0.0.0.0:8080
      OPENINFRA_DEV_DASHBOARD_INSECURE: "true"
      # ADR-031 §2: the OpenStack-compatible surface (Keystone/Nova/
      # Neutron/Glance/Cinder) is a separate listener from the dashboard
      # above, defaulting to loopback-only inside the container
      # (control-plane/cmd/controlplane/main.go's loopbackHTTPListener).
      # Never wired into this dev stack until now -- found via a post-merge
      # functional check: the entire v2.0 OpenStack API surface built this
      # session had no published port and was unreachable from the host.
      # Same insecure-dev-bind pattern as OPENINFRA_DEV_DASHBOARD_INSECURE
      # above, not a security relaxation of the listener's own auth.
      OPENSTACK_API_HTTP_ADDR: 0.0.0.0:8087
      OPENINFRA_DEV_OPENSTACK_API_INSECURE: "true"
      TLS_CERT_FILE: /run/openinfra-tls/server.crt
      TLS_KEY_FILE: /run/openinfra-tls/server.key
      TLS_CLIENT_CA_FILE: /run/openinfra-tls/ca.crt
      # ADR-027 §1/§5: the Control Plane operates the single CA itself.
      # ca.key already lives in this read-only ./local/certs mount (it has
      # always been generated by generate-dev-certs.sh); this is the first
      # env var that actually reads it, enabling ADR-027 mTLS PKI
      # enrollment/renewal/revocation. Deliberately set on control-plane
      # only -- never on provider-agent/provider-agent-2/provider-agent-3
      # below, matching "never mounted into the provider-agent container."
      # Unset (or OPENINFRA_DEV_INSECURE=true), the Control Plane falls
      # back to the pre-ADR-027 static client.crt/agent-server.crt path
      # unaffected, per the ADR §6 migration sequencing note.
      CA_KEY_FILE: /run/openinfra-tls/ca.key
      AGENT_CLIENT_TLS_CERT_FILE: /run/openinfra-tls/client.crt
      AGENT_CLIENT_TLS_KEY_FILE: /run/openinfra-tls/client.key
      AGENT_CLIENT_TLS_CA_FILE: /run/openinfra-tls/ca.crt
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:50051:50051"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:8087:8087"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./local/certs:/run/openinfra-tls:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/grpc-health-probe
        - -addr=127.0.0.1:50051
        - -tls
        - -tls-ca-cert=/run/openinfra-tls/ca.crt
        - -tls-client-cert=/run/openinfra-tls/client.crt
        - -tls-client-key=/run/openinfra-tls/client.key
        - -tls-server-name=control-plane
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0@sha256:2f92c6e85a1199b3403c99d7439695898a162c69689b11130450ffadb352f0a0
    environment:
      CONTAINERS: "1"
      IMAGES: "1"
      INFO: "1"
      # Issue #174: agent-executor now creates (and inspects) a dedicated,
      # ICC-disabled bridge network for workload isolation via bollard's
      # Network API (/networks/*). Without this flag the proxy 403s every
      # /networks request regardless of POST below -- confirmed against
      # tecnativa/docker-socket-proxy's own category-gate behavior, where
      # each resource category (CONTAINERS/IMAGES/NETWORKS/...) is an
      # independent allow-list, not implied by POST/GET alone.
      NETWORKS: "1"
      PING: "1"
      POST: "1"
      VERSION: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker-executor
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    restart: unless-stopped
    tmpfs:
      - /run:size=4m,noexec,nosuid
      - /tmp:size=4m,noexec,nosuid
    security_opt:
      - no-new-privileges:true

  provider-agent:
    build:
      context: ..
      dockerfile: provider-agent/Dockerfile
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      OPENINFRA_AGENT_ADVERTISED_ENDPOINT: https://provider-agent:50052
      OPENINFRA_CONTROL_PLANE_ENDPOINT: https://control-plane:50051
      OPENINFRA_AGENT_MAX_WORKLOADS: ${PROVIDER_AGENT_MAX_WORKLOADS:-8}
      OPENINFRA_AGENT_MAX_CPU_CORES: ${PROVIDER_AGENT_MAX_CPU_CORES:-8.0}
      OPENINFRA_AGENT_MAX_MEMORY_MB: ${PROVIDER_AGENT_MAX_MEMORY_MB:-16384}
      OPENINFRA_AGENT_PIDS_LIMIT: ${PROVIDER_AGENT_PIDS_LIMIT:-128}
      OPENINFRA_AGENT_MAX_EGRESS_MBPS: ${PROVIDER_AGENT_MAX_EGRESS_MBPS:-10000}
      # ADR-027 §2/§6: TLS_CERT_FILE/TLS_KEY_FILE deliberately unset --
      # this Agent enrolls dynamically via CompleteJoin (a fresh
      # self-signed bootstrap identity, then the Control-Plane-issued
      # leaf certificate) instead of presenting the old shared
      # client.crt/client.key identity every instance used to hand-copy.
      # TLS_CA_FILE/TLS_SERVER_NAME are still needed to verify the
      # Control Plane's own server identity either way.
      TLS_CA_FILE: /run/openinfra-tls/ca.crt
      TLS_SERVER_NAME: control-plane
      AGENT_TLS_CERT_FILE: /run/openinfra-tls/agent-server.crt
      AGENT_TLS_KEY_FILE: /run/openinfra-tls/agent-server.key
      AGENT_TLS_CLIENT_CA_FILE: /run/openinfra-tls/ca.crt
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${PROVIDER_AGENT_PORT:-50052}:50052"
    volumes:
      - ./local/agent:/var/lib/openinfra-agent
      - ./local/certs:/run/openinfra-tls:ro
    networks:
      - default
      - docker-executor
    depends_on:
      control-plane:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/openinfra-agent-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    # ADR-025 §3: the Agent process runs `tc qdisc replace` against the
    # host side of each workload's veth pair to enforce its reserved
    # egress rate, which needs CAP_NET_ADMIN. This is the one capability
    # added back after `cap_drop: ALL` above -- the workload containers
    # the Agent creates via Docker are unaffected (their own HostConfig
    # keeps `cap_drop: ALL`/`no-new-privileges` independently, applied by
    # agent-executor, not by this file). See deployments/provider-agent.md
    # for the full trust-boundary note.
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  # provider-agent-2 and provider-agent-3 (below) are the opt-in
  # "multi-node" profile: two extra Provider Agent instances so the
  # local dev stack actually has more than one provider to schedule
  # across and for the Network Validators below to challenge, without
  # slowing down or complicating `make dev-up`'s default single-provider
  # case. Enable with `COMPOSE_PROFILES=multi-node make dev-up` (Compose
  # reads COMPOSE_PROFILES from the environment on its own -- no Makefile
  # change needed to activate this). All three provider-agent instances
  # share the one docker-socket-proxy and the one agent-server
  # certificate above: local dev's actual purpose here is observing
  # multi-provider scheduling/challenge behavior, not achieving real
  # resource or trust isolation between simulated providers -- a second
  # or third docker-socket-proxy would still front the same underlying
  # host Docker daemon (see this file's provider-agent comment and
  # deployments/provider-agent.md), and the agent-server certificate's
  # SAN already covers every instance's hostname (see
  # generate-dev-certs.sh). Each instance otherwise matches
  # provider-agent's exact shape: same security posture, same
  # dependencies, its own advertised endpoint/host port/state volume.
  provider-agent-2:
    profiles: ["multi-node"]
    build:
      context: ..
      dockerfile: provider-agent/Dockerfile
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      OPENINFRA_AGENT_ADVERTISED_ENDPOINT: https://provider-agent-2:50052
      OPENINFRA_CONTROL_PLANE_ENDPOINT: https://control-plane:50051
      OPENINFRA_AGENT_MAX_WORKLOADS: ${PROVIDER_AGENT_MAX_WORKLOADS:-8}
      OPENINFRA_AGENT_MAX_CPU_CORES: ${PROVIDER_AGENT_MAX_CPU_CORES:-8.0}
      OPENINFRA_AGENT_MAX_MEMORY_MB: ${PROVIDER_AGENT_MAX_MEMORY_MB:-16384}
      OPENINFRA_AGENT_PIDS_LIMIT: ${PROVIDER_AGENT_PIDS_LIMIT:-128}
      OPENINFRA_AGENT_MAX_EGRESS_MBPS: ${PROVIDER_AGENT_MAX_EGRESS_MBPS:-10000}
      # ADR-027 §2/§6: TLS_CERT_FILE/TLS_KEY_FILE deliberately unset --
      # this Agent enrolls dynamically via CompleteJoin (a fresh
      # self-signed bootstrap identity, then the Control-Plane-issued
      # leaf certificate) instead of presenting the old shared
      # client.crt/client.key identity every instance used to hand-copy.
      # TLS_CA_FILE/TLS_SERVER_NAME are still needed to verify the
      # Control Plane's own server identity either way.
      TLS_CA_FILE: /run/openinfra-tls/ca.crt
      TLS_SERVER_NAME: control-plane
      AGENT_TLS_CERT_FILE: /run/openinfra-tls/agent-server.crt
      AGENT_TLS_KEY_FILE: /run/openinfra-tls/agent-server.key
      AGENT_TLS_CLIENT_CA_FILE: /run/openinfra-tls/ca.crt
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${PROVIDER_AGENT_2_PORT:-50053}:50052"
    volumes:
      - ./local/agent-2:/var/lib/openinfra-agent
      - ./local/certs:/run/openinfra-tls:ro
    networks:
      - default
      - docker-executor
    depends_on:
      control-plane:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/openinfra-agent-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  provider-agent-3:
    profiles: ["multi-node"]
    build:
      context: ..
      dockerfile: provider-agent/Dockerfile
    environment:
      DOCKER_HOST: tcp://docker-socket-proxy:2375
      OPENINFRA_AGENT_ADVERTISED_ENDPOINT: https://provider-agent-3:50052
      OPENINFRA_CONTROL_PLANE_ENDPOINT: https://control-plane:50051
      OPENINFRA_AGENT_MAX_WORKLOADS: ${PROVIDER_AGENT_MAX_WORKLOADS:-8}
      OPENINFRA_AGENT_MAX_CPU_CORES: ${PROVIDER_AGENT_MAX_CPU_CORES:-8.0}
      OPENINFRA_AGENT_MAX_MEMORY_MB: ${PROVIDER_AGENT_MAX_MEMORY_MB:-16384}
      OPENINFRA_AGENT_PIDS_LIMIT: ${PROVIDER_AGENT_PIDS_LIMIT:-128}
      OPENINFRA_AGENT_MAX_EGRESS_MBPS: ${PROVIDER_AGENT_MAX_EGRESS_MBPS:-10000}
      # ADR-027 §2/§6: TLS_CERT_FILE/TLS_KEY_FILE deliberately unset --
      # this Agent enrolls dynamically via CompleteJoin (a fresh
      # self-signed bootstrap identity, then the Control-Plane-issued
      # leaf certificate) instead of presenting the old shared
      # client.crt/client.key identity every instance used to hand-copy.
      # TLS_CA_FILE/TLS_SERVER_NAME are still needed to verify the
      # Control Plane's own server identity either way.
      TLS_CA_FILE: /run/openinfra-tls/ca.crt
      TLS_SERVER_NAME: control-plane
      AGENT_TLS_CERT_FILE: /run/openinfra-tls/agent-server.crt
      AGENT_TLS_KEY_FILE: /run/openinfra-tls/agent-server.key
      AGENT_TLS_CLIENT_CA_FILE: /run/openinfra-tls/ca.crt
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:${PROVIDER_AGENT_3_PORT:-50054}:50052"
    volumes:
      - ./local/agent-3:/var/lib/openinfra-agent
      - ./local/certs:/run/openinfra-tls:ro
    networks:
      - default
      - docker-executor
    depends_on:
      control-plane:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/openinfra-agent-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true

  # networkvalidator runs cmd/networkvalidator's continuous challenge
  # loop (ADR-011/013): it is part of the *default* stack (no profile),
  # unlike provider-agent-2/3 below, because a Network Validator daemon
  # is what makes "OpenInfra Network" actually observable at all in local
  # dev (previously: zero instances wired into Compose, confirmed by
  # inspection). A single validator can register, go ACTIVE, and submit
  # evidence, but pallet-network-validator's MinQuorum (3,
  # blockchain/runtime/src/lib.rs) means a round can never actually
  # *close* with only one validator -- see networkvalidator-2/3 below,
  # and deployments/network-validator.md, for the full committee. This
  # service builds from the same image as control-plane (its binary
  # ships in that same Dockerfile) and only overrides the entrypoint/
  # command to run networkvalidator instead. It never joins
  # docker-executor: it never touches Docker, only the chain RPC and
  # each Agent's mTLS gRPC endpoint over the default network.
  #
  # Healthcheck: this binary has no listening port to probe (a pure
  # outbound challenge loop -- unlike provider-agent/control-plane, which
  # each ship a dedicated probe binary/endpoint for exactly this reason).
  # `networkvalidator status` is what's actually realistic to probe with
  # instead: a real, already-shipped subcommand, valid as a distroless
  # `CMD`-form healthcheck (no shell required), that fails loudly (a
  # useful liveness signal) if VALIDATOR_SIGNER_KEY_FILE is missing or
  # unreadable (e.g. a LOCAL_UID mismatch, or key generation interrupted
  # mid-write) or if the chain RPC is unreachable, and succeeds whether
  # or not this validator has been registered yet (bootstrap-network-
  # validators.sh runs after the stack is already up, so "not registered
  # yet" must not read as unhealthy). Without this, `docker compose up
  # --wait` cannot distinguish a validator that's actually running from
  # one crash-looping on a bad key file -- `make dev-up` would report
  # success either way.
  networkvalidator:
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    entrypoint: ["/usr/local/bin/networkvalidator"]
    command: ["run"]
    environment:
      SUBSTRATE_RPC_URL: http://blockchain-node:9944
      VALIDATOR_SIGNER_KEY_FILE: /run/openinfra-validator/validator-key.pem
      DASHBOARD_BASE_URL: http://control-plane:8080
      AGENT_SERVER_CA_FILE: /run/openinfra-tls/ca.crt
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./local/validators:/run/openinfra-validator:ro
      - ./local/certs:/run/openinfra-tls:ro
    networks:
      - default
    depends_on:
      control-plane:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/networkvalidator", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  # networkvalidator-2 and networkvalidator-3: the rest of the "multi-
  # node" profile's committee. Together with networkvalidator above they
  # reach MinQuorum=3 (blockchain/runtime/src/lib.rs), the minimum for a
  # round to actually close and push an aggregate into pallet-reputation
  # -- TargetCommitteeSize is 5, but a round only needs quorum among
  # whichever committee members are active, not the full target size.
  # Same shape as networkvalidator above, just a different
  # VALIDATOR_SIGNER_KEY_FILE (deployments/scripts/generate-dev-certs.sh
  # generates all three keys unconditionally, so they exist whether or
  # not this profile is enabled).
  networkvalidator-2:
    profiles: ["multi-node"]
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    entrypoint: ["/usr/local/bin/networkvalidator"]
    command: ["run"]
    environment:
      SUBSTRATE_RPC_URL: http://blockchain-node:9944
      VALIDATOR_SIGNER_KEY_FILE: /run/openinfra-validator/validator-2-key.pem
      DASHBOARD_BASE_URL: http://control-plane:8080
      AGENT_SERVER_CA_FILE: /run/openinfra-tls/ca.crt
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./local/validators:/run/openinfra-validator:ro
      - ./local/certs:/run/openinfra-tls:ro
    networks:
      - default
    depends_on:
      control-plane:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/networkvalidator", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  networkvalidator-3:
    profiles: ["multi-node"]
    build:
      context: ..
      dockerfile: control-plane/Dockerfile
    entrypoint: ["/usr/local/bin/networkvalidator"]
    command: ["run"]
    environment:
      SUBSTRATE_RPC_URL: http://blockchain-node:9944
      VALIDATOR_SIGNER_KEY_FILE: /run/openinfra-validator/validator-3-key.pem
      DASHBOARD_BASE_URL: http://control-plane:8080
      AGENT_SERVER_CA_FILE: /run/openinfra-tls/ca.crt
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./local/validators:/run/openinfra-validator:ro
      - ./local/certs:/run/openinfra-tls:ro
    networks:
      - default
    depends_on:
      control-plane:
        condition: service_healthy
      blockchain-node:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/networkvalidator", "status"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=8m,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  docker-executor:
    internal: true

volumes:
  postgres-data:
  redis-data:
  substrate-data:
  ipfs-data:
