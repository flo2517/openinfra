[workspace]
members = [
    "node",
    "pallets/availability",
    "pallets/lease",
    "pallets/provider-registry",
    "pallets/reputation",
    "pallets/resource-market",
    "pallets/rewards",
    "runtime",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openinfra/network"

[workspace.dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive", "max-encoded-len"] }
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
sp-core = { version = "43.0.0", default-features = false }
sp-io = { version = "48.0.0", default-features = false }
sp-runtime = { version = "48.0.0", default-features = false }

[profile.release]
panic = "unwind"
