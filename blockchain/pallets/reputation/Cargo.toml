[package]
name = "pallet-reputation"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }

[dev-dependencies]
sp-core = { version = "43.0.0" }
sp-io = { version = "48.0.0" }
sp-runtime = { version = "48.0.0" }

[features]
default = ["std"]
runtime-benchmarks = []
std = ["codec/std", "scale-info/std", "frame-support/std", "frame-system/std"]
