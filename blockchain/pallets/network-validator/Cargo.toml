[package]
name = "pallet-network-validator"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true }
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
# ADR-036 §5: consumes pallet-provider-registry's ProviderBondInspector
# trait directly for register_validator's reserve-contamination guard
# (mirrors pallet-resource-market's existing direct dependency on this
# crate for its own ProviderInspector trait).
pallet-provider-registry = { path = "../provider-registry", default-features = false }
scale-info = { workspace = true }

[dev-dependencies]
# Pinned to the exact release already resolved elsewhere in this workspace
# (via the runtime's polkadot-sdk umbrella pull) so this crate's test-only
# dependency graph reuses the same frame-support/frame-system 48.0.0
# instead of resolving a second, incompatible copy.
pallet-balances = { version = "=50.0.0" }
sp-io = { version = "48.0.0" }
sp-runtime = { version = "48.0.0" }

[features]
default = ["std"]
runtime-benchmarks = []
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-provider-registry/std",
    "scale-info/std",
]
