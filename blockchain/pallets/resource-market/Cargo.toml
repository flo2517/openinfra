[package]
name = "pallet-resource-market"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.7.5", default-features = false, features = ["derive"] }
frame-support = { version = "48.0.0", default-features = false }
frame-system = { version = "48.0.0", default-features = false }
pallet-provider-registry = { path = "../provider-registry", default-features = false }
scale-info = { version = "2.11.6", default-features = false, features = ["derive"] }

[dev-dependencies]
sp-io = "48.0.0"
sp-runtime = "48.0.0"

[features]
default = ["std"]
std = [
    "codec/std",
    "frame-support/std",
    "frame-system/std",
    "pallet-provider-registry/std",
    "scale-info/std",
]
