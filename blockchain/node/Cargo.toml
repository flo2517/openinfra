[package]
name = "openinfra-node"
description = "OpenInfra Network local Substrate development node"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[dependencies]
clap = { version = "4.5.13", features = ["derive"] }
hex = "0.4.3"
jsonrpsee = { version = "0.24.11", features = ["server"] }
openinfra-runtime = { path = "../runtime" }
polkadot-sdk = { version = "=2606.0.0", features = ["experimental", "node"] }
serde_json = "1"

[build-dependencies]
polkadot-sdk = { version = "=2606.0.0", features = ["substrate-build-script-utils"] }

[features]
default = ["std"]
std = ["openinfra-runtime/std", "polkadot-sdk/std"]
