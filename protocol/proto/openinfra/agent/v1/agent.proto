syntax = "proto3";
package openinfra.agent.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/openinfra/network/protocol/generated/go/agent/v1;agentv1";

import "openinfra/shared/v1/shared.proto";

service ProviderAgentService {
  rpc GetAgentInfo(GetAgentInfoRequest) returns (GetAgentInfoResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc GetInventory(GetInventoryRequest) returns (GetInventoryResponse);
  rpc SolveChallenge(SolveChallengeRequest) returns (SolveChallengeResponse);
  rpc Deploy(DeployRequest) returns (DeployResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc GetWorkloadStatus(GetWorkloadStatusRequest) returns (GetWorkloadStatusResponse);
  rpc StreamMetrics(StreamMetricsRequest) returns (stream StreamMetricsResponse);
  // ADR-015: independent bandwidth throughput measurement. A dedicated RPC,
  // deliberately not an overload of SolveChallenge's existing TYPE_NETWORK
  // (see ADR-015 §1) -- that type is already merged and exercised by the
  // live challenge loop (#85) with its existing small-payload liveness/
  // correctness semantics, which this does not change.
  rpc MeasureBandwidth(MeasureBandwidthRequest) returns (MeasureBandwidthResponse);
  // ADR-029 / issue #20: pulled by the Control Plane (or any other
  // relayer holding a live Agent connection), not pushed by the Agent --
  // the least-invasive fit on this service, matching GetWorkloadStatus's
  // existing pull shape rather than ReportHeartbeat's push shape on
  // ControlPlaneService. Returns one bounded, signed MeteringSummary
  // covering usage since that workload's last-issued sequence. See
  // GetUsageSummaryResponse's doc comment for the signing/hash details.
  rpc GetUsageSummary(GetUsageSummaryRequest) returns (GetUsageSummaryResponse);
  // ADR-034 §6/§7 / issue #171: securely deletes the Docker named volume
  // backing a Cinder block volume (control-plane's cinder_volumes row,
  // migration 000021) on this specific Agent -- the only volume
  // lifecycle operation that needs a dedicated RPC rather than riding on
  // Deploy/Stop, since a volume being deleted has, by construction
  // (internal/openstackapi/cinder only permits delete from the
  // 'available' state), no currently-running workload/DeployRequest to
  // attach the request to. Called by the Control Plane only after its
  // own Postgres-side transition to 'deleting' has already committed
  // (ADR-034 §2) -- this RPC is the Agent-side half of that already-
  // decided delete, not itself an authorization decision.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeleteVolumeResponse);
}

message GetAgentInfoResponse {
  string version = 1;
  string node_id = 2;
  string public_key = 3;
  string protocol_version = 4;
  repeated string capabilities = 5;
  uint64 uptime_seconds = 6;
}

message SolveChallengeRequest {
  string challenge_id = 1;
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_COMPUTE = 1;
    TYPE_STORAGE = 2;
    TYPE_AVAILABILITY = 3;
    // Added for ADR-013 slice 4 (issue #78): a Network Validator's
    // challenge loop scores these two additional dimensions of
    // pallet-network-validator's ScoreDimension enum. compute/storage/
    // availability above predate this addition and are unchanged.
    TYPE_NETWORK = 4;
    TYPE_RELIABILITY = 5;
  }
  Type type = 2;
  bytes payload = 3;
}

message SolveChallengeResponse {
  string challenge_id = 1;
  string resource_type = 2;
  bytes result = 3;
  uint32 duration_ms = 4;
  bytes signature = 5;
}

message DeployRequest {
  string workload_id = 1;
  string lease_id = 2;
  string image = 3;
  ResourceLimits limits = 4;
  // ADR-028 §3: when this workload's lease authorization ends. Sourced from
  // the same lease term the orchestrator already computes before calling
  // Deploy (control-plane/internal/orchestrator/worker.go). Required: the
  // Agent refuses a DeployRequest with no lease_end (see agent-executor's
  // deployment() validation) because it would otherwise have no way to
  // locally bound how long it is authorized to keep the workload running if
  // it becomes disconnected from the Control Plane (ADR-028 §2/§3) -- a
  // stricter reading than the ADR's own text, which only says the field is
  // added, not that it is mandatory; treated as mandatory here as the more
  // conservative interpretation.
  google.protobuf.Timestamp lease_end = 5;
  // ADR-033 §8/§9 / issue #168: which execution backend runs this
  // workload. RUNTIME_UNSPECIFIED (the proto3 default, and the value
  // every DeployRequest built before this field existed implicitly
  // carries) is treated identically to RUNTIME_CONTAINER by the Agent's
  // gRPC server -- additive, backward-compatible: a Control Plane/Agent
  // pair that predates this field keeps deploying Docker workloads
  // exactly as before.
  Runtime runtime = 6;
  // Required, and only meaningful, when runtime == RUNTIME_VM. `image`
  // above is ignored for a VM-flavored request -- vm.vm_image_url is the
  // qcow2 reference instead, matching ADR-033 §4's "no OCI registry
  // concept for a raw/qcow2 disk image" reasoning. vcpu/memory sizing
  // deliberately reuses `limits.cpu_cores`/`limits.memory_mb` rather than
  // duplicating them on VmSpec -- cpu_cores must be a whole number for a
  // VM's vcpu count (agent-executor rejects a fractional value).
  VmSpec vm = 7;
  // ADR-034 §7 / issue #171: Cinder block volumes to mount into this
  // workload's container at create time. Empty (the default -- every
  // DeployRequest built before this field existed implicitly carries no
  // volumes) is the common case and changes nothing about deploy
  // behavior, additive and backward-compatible like `runtime`/`vm`
  // above. Only meaningful for RUNTIME_CONTAINER: ADR-034 §5 keeps VM
  // boot disks and Cinder volumes deliberately separate mechanisms, and
  // attaching a Cinder volume to a VM workload is explicitly out of
  // scope (ADR-034 §8) -- agent-executor's vm::VmExecutor ignores this
  // field entirely, the same way DockerExecutor ignores `vm` (§4's own
  // "ignored for a VM-flavored request" precedent, mirrored here).
  //
  // Populated by control-plane/internal/orchestrator's deploy dispatch
  // from cinder_volumes rows already attached (Postgres-authoritative,
  // ADR-034 §3) to this workload_id on the target provider at the
  // moment Deploy is dispatched -- a volume attached to an already-
  // *running* workload after its first Deploy has no effect until that
  // workload's next Deploy dispatch (there is no live-remount
  // mechanism), a named limitation matching this codebase's existing
  // "no callable redeploy" gap (internal/openstackapi/nova's package
  // doc comment) rather than a silently half-built fix.
  repeated VolumeAttachment volumes = 8;
}

enum Runtime {
  RUNTIME_UNSPECIFIED = 0;
  RUNTIME_CONTAINER = 1;
  RUNTIME_VM = 2;
}

// ADR-034 §1/§7: one Cinder volume attached into this container. volume_id
// is the Docker named volume's own name (agent-executor mints it
// deterministically from the Cinder volume_id, see agent-executor's own
// doc comment on volume naming) -- the Agent creates the underlying
// Docker volume on first use if it does not already exist (ADR-034 §2:
// "nothing is created on any provider host until the volume is first
// attached").
message VolumeAttachment {
  string volume_id = 1;
  string mount_path = 2;
  bool read_only = 3;
}

// ADR-033 §4: digest-pinned, fetched over HTTPS, verified before first
// boot -- the VM analog of `image`'s OCI `name@sha256:digest` convention,
// necessarily shaped differently since there is no OCI registry concept
// for a raw/qcow2 disk image. Both fields are required (agent-executor's
// vm::VmExecutor::validate rejects a missing/malformed value); see
// docs/adr/033-vm-execution-backend.md §4.
message VmSpec {
  string vm_image_url = 1;
  string vm_image_sha256 = 2;
}

message ResourceLimits {
  float cpu_cores = 1;
  int64 memory_mb = 2;
  // ADR-025 §3: the workload's *reserved* egress rate, megabits per
  // second -- sourced from the same WorkloadDefinition.Requirements.
  // Bandwidth.egress_mbps (shared.proto) the scheduler already fit-scores
  // against, carried through to the Agent alongside cpu_cores/memory_mb
  // so agent-executor can apply a host-side `tc` ceiling at container
  // start, the same way memory_mb/cpu_cores become Docker's HostConfig
  // quotas. 0 means the workload declared no bandwidth requirement --
  // no `tc` rule is applied, matching Bandwidth's existing "0 means not
  // advertised" convention elsewhere on this message. Egress only in
  // this slice; ingress shaping is a known, deliberately deferred
  // asymmetry (see the ADR).
  int32 egress_mbps = 3;
}

message DeployResponse {
  bool success = 1;
  string container_id = 2;
  string error = 3;
}

message StopRequest {
  string workload_id = 1;
}

message StopResponse {
  bool success = 1;
  string error = 2;
}

message GetWorkloadStatusRequest {
  string workload_id = 1;
}

message GetWorkloadStatusResponse {
  string workload_id = 1;
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_CREATED = 1;
    STATE_PENDING = 2;
    STATE_DEPLOYING = 3;
    STATE_RUNNING = 4;
    STATE_STOPPING = 5;
    STATE_COMPLETED = 6;
    STATE_FAILED = 7;
  }
  State state = 2;
  string details = 3;
}

message GetInventoryRequest {}
message GetInventoryResponse {
  float cpu_cores = 1;
  int64 total_memory_mb = 2;
  int64 available_memory_mb = 3;
}

message StreamMetricsRequest {}
message StreamMetricsResponse {
  string metric_name = 1;
  double value = 2;
  int64 timestamp = 3;
}

// ADR-015 §1. Both directions share one round trip deliberately: a caller
// that wants only one direction sets the other side's size to (near)
// zero, avoiding the clock-skew problems of reconciling two separately
// timed calls.
message MeasureBandwidthRequest {
  string probe_id = 1;
  // Sent by the validator; its size is what's actually being measured
  // for *ingress* (validator -> Agent). Bounded server-side by
  // agent-api's MAX_BANDWIDTH_PROBE_BYTES.
  bytes upload_payload = 2;
  // Requested size of download_payload in the response, for measuring
  // *egress* (Agent -> validator) in the same round trip. 0 means "don't
  // bother," e.g. when a caller only wants one direction this probe.
  uint32 requested_download_bytes = 3;
}

message MeasureBandwidthResponse {
  string probe_id = 1;
  bytes upload_payload_hash = 2;   // SHA256(upload_payload) -- proves full, correct receipt
  bytes download_payload = 3;      // exactly requested_download_bytes of Agent-generated data
  uint32 server_processing_ms = 4; // time from full request received to response ready, excluding queueing
  bytes signature = 5;             // Ed25519 over a domain-separated construction, see agent-api's BANDWIDTH_PROBE_DOMAIN
}

message HealthCheckRequest {}
message HealthCheckResponse { bool healthy = 1; string status = 2; }
message GetAgentInfoRequest {}

message GetUsageSummaryRequest {
  string workload_id = 1;
}

// evidence_hash and signature are both computed over the identical
// canonical byte encoding of `summary` (agent-api's METERING_DOMAIN
// construction) -- the hash is not a hash of this response message, and
// is not itself signed separately; it is provided purely so a verifier
// or a later on-chain relay (#21) does not need to recompute it just to
// correlate this response with a stored evidence row. lowercase hex,
// matching this protocol's existing provider_id convention.
message GetUsageSummaryResponse {
  openinfra.shared.v1.MeteringSummary summary = 1;
  bytes signature = 2;
  string evidence_hash = 3;
}

// ADR-034 §6: volume_id is the same Docker volume name VolumeAttachment
// carries. Deleting a volume this Agent has no record of (never
// attached here, or already removed) is treated as success -- the
// desired end state (no such Docker volume) already holds, matching
// Stop's own idempotent-at-the-Agent-boundary convention
// (agentmanager.Client.StopAndConfirm's doc comment).
message DeleteVolumeRequest {
  string volume_id = 1;
}

message DeleteVolumeResponse {
  bool success = 1;
  string error = 2;
}
