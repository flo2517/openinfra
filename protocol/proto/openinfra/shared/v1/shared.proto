syntax = "proto3";

package openinfra.shared.v1;

option go_package = "github.com/openinfra/network/protocol/generated/go/shared/v1;sharedv1";

import "google/protobuf/timestamp.proto";

// --- Node Identity ---
message NodeIdentity {
  string node_id = 1;
  string public_key = 2;
  string protocol_version = 3;
  string agent_version = 4;
  ResourceCapability capabilities = 5;
  NodeStatus status = 6;
}

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_PENDING = 1;
  NODE_STATUS_ACTIVE = 2;
  NODE_STATUS_OFFLINE = 3;
  NODE_STATUS_DRAINING = 4;
  NODE_STATUS_MAINTENANCE = 5;
  // ADR-027 §4: set only by the operator `controlplane-admin
  // revoke-provider` subcommand, never by the provider itself. Excluded
  // from scheduling by the same `providers.status = ACTIVE` filters every
  // other non-ACTIVE status already uses (agentmanager.ListActive), and
  // additionally cuts mTLS connectivity via the Redis-backed revocation
  // set (internal/pki) -- see the ADR for the full mechanism.
  NODE_STATUS_REVOKED = 6;
}

// --- Resource Capability ---
message ResourceCapability {
  float cpu_total = 1;
  float cpu_available = 2;
  int64 ram_total_mb = 3;
  int64 ram_available_mb = 4;
  int64 storage_total_gb = 5;
  int64 storage_available_gb = 6;
  GPUCapability gpu = 7;
  Bandwidth bandwidth = 8;
  string zone = 9;
  // ADR-033 §7: whether this provider passed the Agent's fail-closed
  // KVM_GET_API_VERSION probe (provider-agent/crates/agent-inventory's
  // kvm.rs) and can therefore run VM-backed workloads. Additive,
  // proto3-default-false: any Agent binary that predates this field (or
  // that ran the probe and got a negative/inconclusive result) simply
  // never sets it, which is exactly the fail-closed behavior wanted --
  // "unset" and "explicitly false" are indistinguishable on the wire on
  // purpose, matching how ADR-025 already treats an unset Bandwidth as
  // zero capacity for that dimension. The scheduler must never offer a
  // VM workload to a provider that hasn't explicitly reported this true.
  bool virtualization_capable = 10;
}

message GPUCapability {
  string model = 1;
  int64 vram_total_mb = 2;
  int64 vram_available_mb = 3;
  int32 count = 4;
}

// Bandwidth describes a provider's advertised network capacity (on
// ResourceCapability) or a workload's minimum requested network capacity
// (on ResourceRequirements). Every field's unit is explicit and integer,
// matching the wire protocol's existing no-implicit-float convention
// (basis points for reputation/reward fractions, plain integers
// everywhere else) rather than a float fraction or an ambiguous "some
// unit" number:
//   ingress_mbps / egress_mbps: sustained throughput ceiling, megabits
//     per second (10^6 bits/s -- the conventional networking Mbps, not
//     mebibytes).
//   burst_mbps: the highest short-lived throughput ceiling above the
//     sustained rate the link tolerates. 0 means "no burst allowance
//     advertised" (== the sustained rate), not "unlimited".
//   latency_ms / jitter_ms: round-trip latency and its variation,
//     milliseconds.
//   loss_bps: packet loss rate in basis points (parts per 10,000; 100 =
//     1%), matching ReputationVector/Rewards' existing basis-point
//     convention instead of a float fraction.
//   transfer_cap_gb: a billing-period transfer allowance, gigabytes
//     (10^9 bytes). 0 means "not advertised/no cap", not "zero transfer".
message Bandwidth {
  int32 ingress_mbps = 1;
  int32 egress_mbps = 2;
  int32 burst_mbps = 3;
  int32 latency_ms = 4;
  int32 jitter_ms = 5;
  int32 loss_bps = 6;
  int64 transfer_cap_gb = 7;
}

// --- Reputation Vector ---
message ReputationVector {
  float compute = 1;
  float storage = 2;
  float network = 3;
  float availability = 4;
  float reliability = 5;
  float global = 6;
}

// --- Workload Definition ---
message WorkloadDefinition {
  string workload_id = 1;
  WorkloadProfile profile = 2;
  ResourceRequirements requirements = 3;
  WorkloadConstraints constraints = 4;
  int32 duration_seconds = 5;
}

enum WorkloadProfile {
  WORKLOAD_PROFILE_UNSPECIFIED = 0;
  WORKLOAD_PROFILE_COMPUTE_INTENSIVE = 1;
  WORKLOAD_PROFILE_MEMORY_INTENSIVE = 2;
  WORKLOAD_PROFILE_STORAGE_INTENSIVE = 3;
  WORKLOAD_PROFILE_LATENCY_SENSITIVE = 4;
}

message ResourceRequirements {
  float cpu = 1;
  int64 ram_mb = 2;
  int64 storage_gb = 3;
  int32 gpu_count = 4;
  // Optional: unset (nil) means the workload has no minimum bandwidth
  // requirement. Only ingress_mbps/egress_mbps are meaningful here today
  // -- see issue #30 for the scheduling/enforcement side.
  Bandwidth bandwidth = 5;
}

message WorkloadConstraints {
  int32 max_latency_ms = 1;
  float min_reputation = 2;
  float max_price = 3;
  string required_zone = 4;
  // ADR-033 §7 / issue #166: this workload must run as a VM, not a
  // container. The scheduler must never rank a provider that has not
  // explicitly reported ResourceCapability.virtualization_capable = true
  // as eligible when this is set -- absent/false capability is "cannot
  // run VM workloads", never "unknown, try anyway", matching how
  // required_zone above is already a hard exclusion, not a soft
  // preference (ADR-026 §4). Default false: an ordinary container
  // workload is unaffected and needs no changes.
  bool requires_vm = 5;
}

// --- Lease Object ---
message Lease {
  string lease_id = 1;
  string provider_id = 2;
  string consumer_id = 3;
  string workload_id = 4;
  google.protobuf.Timestamp start = 5;
  google.protobuf.Timestamp end = 6;
  LeaseState state = 7;
}

enum LeaseState {
  LEASE_STATE_UNSPECIFIED = 0;
  LEASE_STATE_PENDING = 1;
  LEASE_STATE_ACTIVE = 2;
  LEASE_STATE_COMPLETED = 3;
  LEASE_STATE_FAILED = 4;
  LEASE_STATE_EXPIRED = 5;
}

// --- Event Envelope (ADR-039 / issue #33) ---
//
// ChainAnchor is ADR-039 §5's reference to an already-finalized
// pallet-lease fact (LeaseCreated / LeaseStateChanged): an independent
// witness holding only a chain node and a copy of the event log can
// check that lease_id genuinely exists, finalized, at block_hash --
// generalizing ADR-038 §6.2's DeployRequest.scheduling_block_hash from a
// single audit-correlation field to every workload-lifecycle event.
message ChainAnchor {
  uint64 lease_id = 1;
  bytes block_hash = 2; // exactly 32 bytes when present
}

// event_id/event_type/timestamp/source/payload/signature (fields 1-6) are
// this message's original fields -- reserved since before ADR-039, never
// populated or read by any real Go consumer prior to it (confirmed via
// `grep -rl EventEnvelope control-plane --include=*.go`, ADR-039 Context
// -- zero matches outside the generated file itself). Fields 7+ are
// ADR-039's additions, evolving this already-reserved message rather than
// introducing a second, overlapping type (ADR-039 Decision §10, and its
// own Open Questions section for why that specific choice was made, and
// what it leaves unconfirmed: no record of this message's original
// intended purpose exists in this codebase). internal/eventlog.Entry
// (control-plane) is the canonical, signed, hash-chained representation
// this wire message carries -- see that package's own doc comments for
// the full design (ADR-039 §1-§9).
message EventEnvelope {
  string event_id = 1;
  string event_type = 2;
  google.protobuf.Timestamp timestamp = 3;
  string source = 4;
  bytes payload = 5; // Serialized specific event model
  string signature = 6;

  // subject_type: "WORKLOAD_LIFECYCLE" | "LEASE_CORRELATION" |
  // "METERING_EVIDENCE" (ADR-039 §1) -- a string, not an enum, matching
  // event_type's own existing string convention on this message rather
  // than introducing a second enumeration style.
  string subject_type = 7;
  // subject_id: workload_id (UTF-8 bytes of its UUID text form) for
  // WORKLOAD_LIFECYCLE/LEASE_CORRELATION today; see internal/eventlog's
  // doc comment for METERING_EVIDENCE's still-unwired shape.
  bytes subject_id = 8;
  // sequence: monotonic per (subject_type, subject_id), starting at 1 --
  // never a global ordering key (ADR-039 §2).
  uint64 sequence = 9;
  // prev_event_hash: exactly 32 bytes, all-zero for sequence = 1,
  // otherwise the previous event's event_id (ADR-039 §2's hash chain).
  bytes prev_event_hash = 10;
  // chain_anchor: absent only for a subject's very first event, before
  // any lease exists to anchor against -- ADR-039 §5's honestly-named
  // pre-lease gap, not an omission elsewhere.
  ChainAnchor chain_anchor = 11;
  // payload_hash: exactly 32 bytes, sha256 over the same canonical bytes
  // event_id is computed from (internal/eventlog.CoreBytes) -- present so
  // a witness can verify payload integrity without recomputing event_id
  // first.
  bytes payload_hash = 12;
  // signer_public_key: raw 32-byte Ed25519 public key -- either a
  // registered provider's identity key or the Control Plane's own
  // bridge-account key (ADR-039 §3), never a new key type.
  bytes signer_public_key = 13;
  // signature_bytes: raw 64-byte Ed25519 signature over
  // internal/eventlog.SignedBytes(entry). Distinct from the pre-existing
  // `signature` string field above (field 6) -- that field is never
  // populated for an ADR-039 event, and this one is never populated for
  // whatever this message's original, pre-ADR-039 purpose was, so the two
  // cannot collide in practice; kept separate rather than repurposing
  // field 6's type, which would be a breaking wire change for any future
  // consumer of the original shape.
  bytes signature_bytes = 14;
}

// --- Metering Summary (ADR-029 / issue #20) ---
//
// One workload's bounded, signed usage evidence for a single billing
// period. Mirrors, field for field, ADR-029 §6's on-chain
// `MeteringSummary<BlockNumber>` struct that a future `pallet-escrow`
// (issue #21, not yet implemented) verifies inside `complete_and_payout`
// -- with two off-chain-only additions called out below, since #21 does
// not exist yet to coordinate byte-for-byte wire compatibility. This
// message's own field values (not this proto encoding) are what the
// Agent signs: see agent-api's METERING_DOMAIN and its doc comment for
// the exact canonical byte layout, and
// control-plane/internal/metering/signing.go for the mirrored Go
// verification. That hand-rolled encoding, not this proto's wire form,
// is the actual signed/hashed content -- deliberately, so the signature
// and evidence_hash never depend on proto's marshal behavior agreeing
// byte-for-byte across prost and protobuf-go (the same reasoning
// agent-api already applies to SolveChallenge/MeasureBandwidth).
message MeteringSummary {
  // Off-chain-only (not on ADR-029 §6's on-chain struct): identifies
  // *which* workload this summary covers. lease_id alone is ambiguous
  // off-chain in the general case (though today's schema happens to be
  // 1:1); workload_id is what the Agent's local state and Control
  // Plane's `workloads` table both key on, so it is carried explicitly
  // rather than requiring a join to resolve.
  string workload_id = 1;
  // Matches ADR-029's LeaseId correlation key -- the same lease_id
  // pallet-lease and this repo's `workloads.lease_id` column already
  // use.
  string lease_id = 2;
  // Monotonic per (provider, workload). Replay resistance: the Control
  // Plane rejects/quarantines any sequence <= the last accepted one for
  // this pair, never silently treats it as billable (issue #20's own
  // acceptance criterion).
  uint64 sequence = 3;
  // Unix seconds (UTC), not a chain BlockNumber -- the Agent has no
  // block-number concept (ADR: "the Provider Agent never talks to the
  // chain directly"). A future #21 evidence-relay path converts these to
  // BlockNumber when constructing pallet-escrow's own on-chain struct;
  // that conversion is #21's job, not specified here.
  uint64 period_start = 4;
  uint64 period_end = 5;
  // Explicit schema version (ADR-029 §1/§7): a future dimension or unit
  // change bumps this rather than silently reinterpreting old evidence.
  uint32 metering_schema_version = 6;
  // All four priced dimensions plus the reserved, zero-priced fifth
  // (ADR-029 §1) -- explicit integer units, never a float, matching this
  // wire protocol's existing no-implicit-float convention for anything
  // that touches billing/chain.
  uint64 cpu_core_seconds = 7;
  uint64 ram_mb_seconds = 8;
  uint64 storage_gb_seconds = 9;
  uint64 network_egress_mb = 10;
  uint64 network_ingress_mb = 11;
  // Reserved: priced at 0 and not charged in v1 (ADR-029 §1/§11).
  uint64 gpu_seconds = 12;
}
