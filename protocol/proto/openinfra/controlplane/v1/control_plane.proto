syntax = "proto3";

package openinfra.controlplane.v1;

option go_package = "github.com/openinfra/network/protocol/generated/go/controlplane/v1;controlplanev1";

import "google/protobuf/timestamp.proto";
import "openinfra/shared/v1/shared.proto";

// ControlPlane receives provider-originated registration and liveness calls.
// Every RPC requires mutually authenticated TLS in non-development environments.
service ControlPlaneService {
  // BeginJoin creates a short-lived, single-use challenge. Repeating request_id
  // with the same payload must return the same live challenge.
  rpc BeginJoin(BeginJoinRequest) returns (BeginJoinResponse);

  // CompleteJoin verifies the domain-separated Ed25519 challenge signature.
  // Success persists the provider before returning NODE_STATUS_ACTIVE.
  rpc CompleteJoin(CompleteJoinRequest) returns (CompleteJoinResponse);

  // ReportHeartbeat refreshes reconstructible liveness state. Sequence numbers
  // must increase monotonically per provider identity.
  rpc ReportHeartbeat(ReportHeartbeatRequest) returns (ReportHeartbeatResponse);

  // RenewCertificate (ADR-027 §3) issues a fresh short-lived leaf
  // certificate for a provider that already holds one, callable only over
  // a connection currently authenticated with a still-valid,
  // previously-issued leaf certificate -- never over the bootstrap
  // self-signed path CompleteJoin uses for first enrollment. The Agent
  // triggers this once 50% of its current certificate's lifetime has
  // elapsed, giving a 12h overlap window before the old certificate
  // actually expires.
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);

  // SubmitWorkload durably accepts an idempotent workload request. Acceptance
  // does not imply that scheduling, a lease, or deployment has succeeded.
  rpc SubmitWorkload(SubmitWorkloadRequest) returns (SubmitWorkloadResponse);
  rpc GetWorkload(GetWorkloadRequest) returns (GetWorkloadResponse);
  rpc StopWorkload(StopWorkloadRequest) returns (StopWorkloadResponse);
}

message BeginJoinRequest {
  // UUID generated once for idempotent retries of this operation.
  string request_id = 1;
  // Raw 32-byte Ed25519 verifying key.
  bytes public_key = 2;
  string protocol_version = 3;
  string agent_version = 4;
  // HTTPS endpoint where the Control Plane can reach ProviderAgentService.
  // Dispatch still requires mTLS and a matching Agent identity.
  string agent_endpoint = 5;
}

message BeginJoinResponse {
  string challenge_id = 1;
  // Cryptographically random, opaque bytes; valid for one successful response.
  bytes challenge_nonce = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CompleteJoinRequest {
  // New UUID used to make completion retries idempotent.
  string request_id = 1;
  string challenge_id = 2;
  // Ed25519 signature over "openinfra-join-v1\0" followed by the exact
  // challenge_nonce returned by BeginJoin.
  bytes challenge_signature = 3;
  openinfra.shared.v1.ResourceCapability capabilities = 4;
  // ADR-027 §2: raw 32-byte Ed25519 public key of a freshly generated
  // mTLS leaf keypair, distinct from the provider's long-term identity
  // key above (challenge_signature's key) -- deliberately never reused as
  // TLS session key material, see the ADR for reasoning. The Control
  // Plane's CA certifies this key, binding the issued certificate to
  // provider_id, only after challenge_signature verifies. Tamper
  // protection for this field rests on TLS channel integrity, the same
  // pre-existing property capabilities above already relies on --
  // challenge_signature covers only the nonce, not the rest of this
  // message.
  bytes tls_public_key = 5;
}

message CompleteJoinResponse {
  // Stable lowercase hexadecimal hash of the verified public key.
  string provider_id = 1;
  openinfra.shared.v1.NodeStatus status = 2;
  google.protobuf.Timestamp registered_at = 3;
  uint32 heartbeat_interval_seconds = 4;
  // ADR-027 §2: the CA-issued leaf certificate (PEM), CN/SAN bound to
  // provider_id, certifying tls_public_key above. 24h validity. Empty iff
  // tls_public_key was empty (a caller that doesn't ask for enrollment
  // isn't issued one) -- callers that need mTLS must set tls_public_key.
  string certificate_pem = 5;
  google.protobuf.Timestamp certificate_expires_at = 6;
}

message RenewCertificateRequest {
  // UUID generated once for idempotent retries of this operation.
  string request_id = 1;
  string provider_id = 2;
  // Raw 32-byte Ed25519 public key of a freshly generated mTLS leaf
  // keypair -- leaf keys are never reused across renewal periods either,
  // matching ADR-027 §3's "short-lived all the way down" design.
  bytes new_tls_public_key = 3;
  // Serial number (decimal string) of the certificate presented on the
  // mTLS connection this request arrives on -- must match, so a renewal
  // can only ever extend the specific certificate the connection is
  // already authenticated with.
  string current_certificate_serial = 4;
  // Wall-clock time the Agent signed this request, checked against the
  // Control Plane's own clock within a bounded skew tolerance (ADR-027
  // §3's replay-protection shape, mirroring ReportHeartbeat's
  // observed_at/maxHeartbeatClockSkew convention).
  google.protobuf.Timestamp timestamp = 5;
  // Durably persisted, strictly increasing per-provider counter (the
  // renewal-specific sibling of HeartbeatSigningPayload.sequence).
  uint64 nonce = 6;
  // Ed25519 signature by the provider's long-term identity key (the same
  // key challenge_signature above uses, never the TLS key itself) over
  // "openinfra-cert-renew-v1\0" followed by new_tls_public_key,
  // current_certificate_serial, the deterministic encoding of timestamp,
  // and nonce -- see internal/pki's renewal signing payload for the exact
  // byte layout.
  bytes signature = 7;
}

message RenewCertificateResponse {
  string certificate_pem = 1;
  google.protobuf.Timestamp certificate_expires_at = 2;
  string certificate_serial = 3;
}

message ReportHeartbeatRequest {
  HeartbeatSigningPayload payload = 1;
  // Ed25519 signature over "openinfra-heartbeat-v1\0" followed by the
  // deterministic Protobuf serialization of payload.
  bytes signature = 2;
}

message HeartbeatSigningPayload {
  string request_id = 1;
  string provider_id = 2;
  // Strictly increasing counter persisted by the Agent across restarts.
  uint64 sequence = 3;
  google.protobuf.Timestamp observed_at = 4;
  openinfra.shared.v1.ResourceCapability capabilities = 5;
  // ADR-025 §2: per-workload bandwidth usage observed by the Agent since
  // each container started. Bounded by the Agent's own max_workloads
  // setting; the Control Plane enforces its own ceiling regardless.
  //
  // Carried inside the signing payload rather than alongside it, so the
  // existing heartbeat signature covers it. ADR-025 §2 sketches a
  // per-entry `signature` field and says the exact signed bytes are
  // "pinned by the implementing PR": a second signature here would be the
  // same key signing the same data on the same transport, and two
  // verifications that can disagree are worse than one that cannot.
  repeated WorkloadBandwidthUsage workload_bandwidth = 6;
  // ADR-028 §4: one entry per workload the Agent currently knows about
  // locally (agent-core::local_state::LocalState), on *every* heartbeat --
  // not a special "resuming after disconnect" message. Bounded by the same
  // max_workloads cap LocalState itself already enforces (default 8); the
  // Control Plane additionally enforces its own ceiling regardless (see
  // maxWorkloadStatusEntriesPerHeartbeat), the same defense-in-depth
  // WorkloadBandwidthUsage above already gets. This is what makes
  // reconciliation on reconnect "status-first by construction": the first
  // heartbeat that succeeds after some failed ones carries exactly this
  // same payload shape as any other heartbeat, so the Agent's actual
  // observed state rides on the very call that re-establishes contact.
  repeated WorkloadStatusSummary workload_status = 7;
}

// ADR-028 §4: one workload's Agent-local status, as
// agent-core::local_state::WorkloadRecord itself understands it -- never a
// claim of Control-Plane-confirmed state (see WorkloadPhase's own doc
// comment: it is entirely a vocabulary of locally observed truth).
// providerjoin.Service.ReportHeartbeat reconciles this against its own
// authoritative WorkloadState using the existing state machine; it does not
// invent a new one.
message WorkloadStatusSummary {
  string workload_id = 1;
  AgentWorkloadPhase phase = 2;
  // Empty when the Agent has not yet created a container for this
  // workload (AGENT_WORKLOAD_PHASE_PROVISIONING).
  string container_id = 3;
  // The exact spec_hash agent-core::local_state::WorkloadRecord persisted
  // for this workload -- lets the Control Plane detect (though this ADR
  // does not yet act on) a workload whose locally-persisted spec disagrees
  // with what the Control Plane most recently asked for.
  bytes spec_hash = 4;
}

// AgentWorkloadPhase mirrors agent-core::local_state::WorkloadPhase
// one-to-one -- deliberately not WorkloadState (this message's cousin
// below): the two vocabularies answer different questions ("what does the
// Agent locally observe about this container" vs. "what does the Control
// Plane's own workload lifecycle believe"), and conflating them would let
// an Agent-local phase silently masquerade as Control-Plane-confirmed
// state, which ADR-028 §2 explicitly prohibits.
enum AgentWorkloadPhase {
  AGENT_WORKLOAD_PHASE_UNSPECIFIED = 0;
  AGENT_WORKLOAD_PHASE_PROVISIONING = 1;
  AGENT_WORKLOAD_PHASE_STARTING = 2;
  AGENT_WORKLOAD_PHASE_RUNNING = 3;
  AGENT_WORKLOAD_PHASE_STOPPING = 4;
  AGENT_WORKLOAD_PHASE_STOPPED = 5;
  AGENT_WORKLOAD_PHASE_FAILED = 6;
  AGENT_WORKLOAD_PHASE_LOST = 7;
}

// WorkloadBandwidthUsage is one workload's cumulative byte counters, as
// read by the Agent from the Linux interface counters of that workload's
// own network namespace.
//
// Cumulative since container start, never a delta (ADR-025 §2): the
// Control Plane computes deltas across successive heartbeats itself, so a
// dropped heartbeat cannot be used to hide a window's usage. A counter
// that decreases between reports is discarded rather than trusted.
//
// Directions are stated from the *workload's* point of view: ingress is
// traffic into the workload, egress is traffic out of it.
//
// Not billing-grade (ADR-025 §2): this is Agent-self-reported telemetry,
// not independently cross-checked the way MeasureBandwidth evidence is.
// Anything financial is deferred to the metering/settlement work (v1.1).
message WorkloadBandwidthUsage {
  string workload_id = 1;
  uint64 ingress_bytes_total = 2;
  uint64 egress_bytes_total = 3;
  // When the counters started accumulating -- i.e. when this container
  // started. A change in this value tells the Control Plane the counters
  // were reset by a restart, so the next reading is a new series and not
  // a decrease to be discarded.
  google.protobuf.Timestamp window_started_at = 4;
}

message ReportHeartbeatResponse {
  openinfra.shared.v1.NodeStatus status = 1;
  google.protobuf.Timestamp accepted_at = 2;
  uint32 next_heartbeat_seconds = 3;
  // Raw 32-byte Ed25519 public keys of the currently active Network
  // Validators (ADR-011/ADR-013), refreshed every heartbeat. The Agent
  // uses this to authorize a second mTLS client class alongside the
  // Control Plane's own certificate -- see ADR-013 §3.
  repeated bytes active_validators = 4;
}

enum WorkloadState {
  WORKLOAD_STATE_UNSPECIFIED = 0;
  WORKLOAD_STATE_REQUESTED = 1;
  WORKLOAD_STATE_SCHEDULING = 2;
  WORKLOAD_STATE_LEASE_PENDING = 3;
  WORKLOAD_STATE_LEASED = 4;
  WORKLOAD_STATE_DEPLOYING = 5;
  WORKLOAD_STATE_RUNNING = 6;
  WORKLOAD_STATE_COMPLETED = 7;
  WORKLOAD_STATE_FAILED = 8;
  WORKLOAD_STATE_STOPPING = 9;
  WORKLOAD_STATE_STOPPED = 10;
}

message SubmitWorkloadRequest {
  // UUID reused for safe retries of the exact same submission.
  string request_id = 1;
  openinfra.shared.v1.WorkloadDefinition definition = 2;
  // For an ordinary container workload (definition.constraints.requires_vm
  // unset/false): an immutable OCI reference including an explicit sha256
  // digest. For a VM workload (requires_vm = true, ADR-033 §4/§9, issue
  // #166/#168): an HTTPS URL to a qcow2 image, paired with the required
  // vm_image_sha256 below -- reusing this field rather than adding a
  // parallel one, since exactly one of the two image conventions ever
  // applies to a given submission.
  string image = 3;
  // Required, and only meaningful, when definition.constraints.requires_vm
  // is true: the pinned SHA-256 digest (lowercase hex) of the qcow2 blob
  // at `image`, verified by the Agent before the image is ever booted
  // (ADR-033 §4). Ignored for a container workload.
  string vm_image_sha256 = 4;
}

message SubmitWorkloadResponse {
  string workload_id = 1;
  WorkloadState state = 2;
  google.protobuf.Timestamp created_at = 3;
}

message GetWorkloadRequest {
  string workload_id = 1;
}

message GetWorkloadResponse {
  string workload_id = 1;
  WorkloadState state = 2;
  string provider_id = 3;
  string lease_id = 4;
  string container_id = 5;
  string error_code = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message StopWorkloadRequest {
  string request_id = 1;
  string workload_id = 2;
}

message StopWorkloadResponse {
  string workload_id = 1;
  WorkloadState state = 2;
  google.protobuf.Timestamp updated_at = 3;
}
