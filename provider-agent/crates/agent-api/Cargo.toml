[package]
name = "agent-api"
version = "0.1.0"
edition = "2021"

[dependencies]
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.0", features = ["full"] }
agent-core = { path = "../agent-core" }
agent-inventory = { path = "../agent-inventory" }
anyhow = "1.0"
tracing = "0.1"
async-trait = "0.1"
tokio-stream = "0.1"
sha2 = "0.10"
rand = "0.8"
# Extracts a MeasureBandwidth caller's raw Ed25519 SubjectPublicKeyInfo
# from its mTLS leaf certificate (tonic::Request::peer_certs()) for the
# per-caller rate limiter -- a real X.509 parse, not a byte-offset guess,
# mirroring agent-cli/src/mtls.rs's identical extraction (duplicated, not
# shared, since agent-api cannot depend on agent-cli -- the dependency
# direction runs the other way).
x509-parser = "0.16"

[dev-dependencies]
tempfile = "3"
hex = "0.4"
# Builds a real self-signed Ed25519 certificate to exercise the
# raw-public-key extraction helper against actual DER, the same fixture
# style agent-cli/src/mtls.rs's tests already use.
rcgen = "0.13"

[build-dependencies]
tonic-build = "0.10"
protoc-bin-vendored = "3"
