[package]
name = "agent-executor"
version = "0.1.0"
edition = "2021"

[dependencies]
bollard = "0.15"
tokio = { version = "1.0", features = ["full"] }
# Issue #154: consumes bollard's create_image() pull-progress stream.
# Already a transitive dependency (bollard itself is built on it); pinned
# here directly since we now import StreamExt from it ourselves.
futures-util = "0.3"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
agent-api = { path = "../agent-api" }
agent-core = { path = "../agent-core" }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
# ADR-025 §2: parses Docker's RFC3339 `started_at` container timestamp
# into a `SystemTime` for `WorkloadBandwidth.window_started_at`. Already
# a transitive dependency of this workspace (bollard itself uses it
# internally); pinned here directly rather than assumed, since a version
# drift silently breaking timestamp parsing would corrupt bandwidth
# telemetry, not just fail loudly.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
# ADR-033 §2: Cloud Hypervisor's own local API is plain HTTP over a Unix
# domain socket -- hyper + hyperlocal (already a transitive dependency of
# this crate via bollard, which uses the identical pattern for Docker's
# own socket) give a real, spec-conformant HTTP/1.1 client/server pair
# without hand-rolling wire parsing. Pinned to the same hyper version
# bollard already resolves.
hyper = { version = "0.14", features = ["client", "http1", "tcp"] }
hyperlocal = "0.8"
serde_json = "1.0"
# ADR-033 §4: HTTPS fetch for qcow2 boot images, digest-verified before
# use (image.rs). rustls-tls (not the system OpenSSL/native-tls backend)
# to avoid a new native TLS library dependency in the Agent's build.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
tempfile = "3"
# ADR-028 §3: only tests build DeployRequest.lease_end literals directly;
# production code reads the field through the value the caller already
# supplied on the generated agent_api::proto::DeployRequest type.
prost-types = "0.13"
