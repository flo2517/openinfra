[package]
name = "agent-cli"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-core = { path = "../agent-core" }
agent-api = { path = "../agent-api" }
agent-executor = { path = "../agent-executor" }
agent-inventory = { path = "../agent-inventory" }
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
serde_yaml = "0.9"
tokio = { version = "1.0", features = ["full"] }
tonic = { version = "0.10", features = ["tls"] }
uuid = { version = "1", features = ["v4"] }
hex = "0.4"
prost = "0.12"
prost-types = "0.12"
